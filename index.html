<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mission Week">
<title>Mission Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --panel:#FFFFFF; --panel2:#F4F5FB; --line:#E7E9F5;
    --ink:#282A32; --muted:#9A9EC0; --gold:#E8A317; --cyan:#2FB6D9; --pink:#FF6FA5; --green:#2FAE72; --red:#FF5C5C;
    --shadow:0 2px 10px rgba(38,40,74,.07);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); font-family:'Nunito',sans-serif; color:var(--ink); -webkit-tap-highlight-color:transparent; min-height:100vh; transition:background .3s ease; }
  .app{ max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  h1,h2,h3{ font-family:'Baloo 2',sans-serif; margin:0; }

  .topbar{ display:flex; gap:10px; margin-bottom:16px; align-items:center; }
  .kidbar{ display:flex; gap:10px; flex:1; }
  .kidtab{ flex:1; border:2px solid var(--line); border-radius:18px; padding:10px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; background:var(--panel); color:var(--muted); display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; box-shadow:var(--shadow); }
  .kidtab.active{ color:#fff; border-color:var(--kidcolor); background:var(--kidcolor); box-shadow:0 6px 14px rgba(38,40,74,.18); }
  .gearbtn{ width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer;flex-shrink:0; box-shadow:var(--shadow); }

  .levelcard{ display:flex; align-items:center; gap:12px; background:var(--panel); border:2px solid var(--line); border-radius:18px; padding:12px 14px; margin-bottom:14px; box-shadow:var(--shadow); }
  .levelbadge{ width:46px;height:46px;border-radius:50%; background:conic-gradient(var(--kidcolor) calc(var(--xp,0)*3.6deg), var(--line) 0deg); display:flex;align-items:center;justify-content:center;flex-shrink:0; font-family:'Baloo 2',sans-serif;font-weight:800;font-size:12px; position:relative; }
  .levelbadge::after{ content:'';position:absolute;inset:4px;border-radius:50%;background:var(--panel); }
  .levelbadge span{ position:relative; z-index:1; }
  .levelinfo{ flex:1; }
  .levelinfo .lvltitle{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; }
  .xpbar{ height:8px; background:var(--line); border-radius:5px; overflow:hidden; margin-top:5px; }
  .xpbar > div{ height:100%; background:var(--kidcolor); transition:width .3s ease; }
  .streak{ display:flex; align-items:center; gap:4px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; color:var(--gold); flex-shrink:0; }

  .daytabs{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:16px; }
  .daytab{ border:2px solid var(--line); background:var(--panel); color:var(--muted); border-radius:14px; padding:11px 0; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:14px; cursor:pointer; box-shadow:var(--shadow); position:relative; }
  .daytab.selected{ background:var(--kidcolor); border-color:var(--kidcolor); color:#fff; }
  .daytab.istoday::after{ content:''; position:absolute; bottom:4px; left:50%; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--gold); }
  .weekstrip{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:16px; }
  .daycell{ background:var(--panel); border-radius:14px; border:2px solid var(--line); padding:8px 4px 10px; text-align:center; cursor:pointer; box-shadow:var(--shadow); }
  .daycell.selected{ border-color:var(--kidcolor); }
  .daycell .dlabel{ font-size:11px; font-weight:800; color:var(--muted); margin-bottom:6px; display:block; }
  .ring{ width:34px;height:34px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800; }

  .panel{ background:var(--panel); border-radius:22px; padding:18px; border:2px solid var(--line); margin-bottom:16px; box-shadow:var(--shadow); }
  .panel h2{ font-size:19px; margin-bottom:2px; color:var(--kidcolor); }
  .panelsub{ color:var(--muted); font-weight:700; font-size:12px; margin-bottom:12px; }

  .timeline{ position:relative; padding-left:6px; }
  .trow{ display:flex; align-items:flex-start; gap:10px; padding:9px 6px; border-radius:14px; position:relative; }
  .trow.now{ background:rgba(255,200,87,.1); border:1.5px solid var(--gold); }
  .ttime{ width:64px; flex-shrink:0; font-size:11px; font-weight:800; color:var(--muted); padding-top:8px; }
  .ttime-end{ font-size:9px; font-weight:700; color:var(--muted); opacity:.75; margin-top:1px; }
  .trow.now .ttime{ color:var(--gold); }
  .tbody{ flex:1; display:flex; align-items:center; gap:10px; background:var(--panel2); border-radius:12px; padding:8px 10px; }
  .trow.passive .tbody{ background:transparent; opacity:.6; }
  .ticon{ font-size:18px; width:24px; text-align:center; }
  .tlabel{ flex:1; font-weight:700; font-size:14px; }
  .trow.quest.checked .tlabel{ color:var(--muted); text-decoration:line-through; }
  .checkbox{ width:28px;height:28px;border-radius:9px;border:2.5px solid var(--line); display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer; background:var(--panel); color:transparent; flex-shrink:0; }
  .checkbox.on{ background:var(--kidcolor); border-color:var(--kidcolor); color:#fff; animation:pop .28s ease; }
  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.3) rotate(8deg);} 100%{transform:scale(1);} }
  .nowtag{ font-size:9px; font-weight:800; color:var(--bg); background:var(--gold); border-radius:6px; padding:2px 6px; margin-left:4px; }

  .chestwrap{ text-align:center; padding:14px 10px 6px; }
  .chest{ font-size:56px; cursor:pointer; display:inline-block; animation:wiggle 1.6s ease-in-out infinite; filter:drop-shadow(0 0 14px rgba(255,200,87,.5)); }
  @keyframes wiggle{ 0%,100%{transform:rotate(-4deg);} 50%{transform:rotate(4deg);} }
  .chesttitle{ font-family:'Baloo 2',sans-serif; color:var(--gold); font-size:20px; margin:8px 0 2px; }
  .chestsub{ color:var(--muted); font-weight:700; font-size:13px; margin-bottom:10px; }
  .rewardgrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .rewardbtn{ background:var(--panel2); border:2px solid var(--line); color:var(--ink); border-radius:14px; padding:12px 6px; font-family:'Nunito',sans-serif; font-weight:800; font-size:13px; cursor:pointer; }
  .rewardbtn:hover{ border-color:var(--gold); }
  .claimed{ background:rgba(255,200,87,.12); border:2px solid var(--gold); border-radius:14px; padding:14px; font-weight:800; color:var(--gold); }
  .rewardcard{ border:2px solid var(--gold); background:radial-gradient(circle at top, rgba(255,200,87,.12), transparent 70%); }

  .badgerow{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .badge{ background:var(--panel2); border:2px solid var(--line); border-radius:12px; padding:6px 10px; font-size:12px; font-weight:800; display:flex; align-items:center; gap:5px; opacity:.35; filter:grayscale(1); }
  .badge.unlocked{ opacity:1; filter:none; border-color:var(--gold); }

  .penaltypanel{ border-color:var(--red); }
  .balrow2{ display:flex; gap:10px; margin-bottom:10px; }
  .balbox{ flex:1; background:var(--panel2); border-radius:14px; padding:10px; text-align:center; }
  .balbox .ballabel{ font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; }
  .balbox .balnum{ font-family:'Baloo 2',sans-serif; font-size:24px; font-weight:800; }
  .balbox .balnum.low{ color:var(--red); }
  .modal-overlay{ position:fixed; inset:0; background:rgba(20,20,35,.45); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .modal-box{ background:var(--panel); border-radius:20px; padding:20px; max-width:320px; width:100%; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  .modaltitle{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:17px; margin-bottom:4px; }
  .modalsub{ color:var(--muted); font-weight:700; font-size:13px; margin-bottom:14px; }
  .modalbtns{ display:flex; gap:8px; margin-bottom:10px; }
  .modalbtn{ flex:1; background:var(--red); color:#fff; border:none; border-radius:12px; padding:12px 6px; font-weight:800; font-size:14px; cursor:pointer; }
  .modalcancel{ background:none; border:none; color:var(--muted); font-weight:800; font-size:13px; cursor:pointer; }
  .balancerow{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .balancenum{ font-family:'Baloo 2',sans-serif; font-size:30px; font-weight:800; }
  .balancenum.low{ color:var(--red); }
  .penlist{ display:flex; flex-direction:column; gap:8px; }
  .penrow{ display:flex; align-items:center; gap:10px; background:var(--panel2); border-radius:12px; padding:9px 10px; }
  .penrow .ticon{ font-size:17px; }
  .penrow .tlabel{ flex:1; font-weight:700; font-size:13.5px; }
  .penamt{ font-weight:800; font-size:12.5px; color:var(--red); }
  .pentoggle{ width:28px;height:28px;border-radius:9px;border:2.5px solid var(--line); display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer; background:var(--panel); color:transparent; flex-shrink:0; }
  .pentoggle.on{ background:var(--red); border-color:var(--red); color:#fff; }

  .confetti{ position:fixed; top:-10px; width:8px;height:14px; border-radius:2px; z-index:999; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(360deg); opacity:.9; } }

  /* ---- Edit mode ---- */
  .editrow{ display:flex; gap:6px; align-items:center; background:var(--panel2); border-radius:12px; padding:8px; margin-bottom:6px; }
  .editrow input[type=text]{ background:var(--panel); border:1.5px solid var(--line); color:var(--ink); border-radius:8px; padding:7px 8px; font-family:'Nunito',sans-serif; font-weight:700; font-size:13px; }
  .editrow .ein-time{ width:72px; }
  .editrow .ein-icon{ width:38px; text-align:center; }
  .editrow .ein-label{ flex:1; min-width:0; }
  .editrow input[type=checkbox]{ width:18px;height:18px; flex-shrink:0; }
  .editrow .draghandle{ width:30px; align-self:stretch; display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--kidcolor); cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; flex-shrink:0; border-radius:8px; }
  .editrow .draghandle:active{ background:var(--line); }
  .editrow.dragging{ position:relative; z-index:50; box-shadow:0 8px 22px rgba(0,0,0,.22); opacity:.95; transition:none; }
  .editrow.shifting{ transition:transform .15s; }
  .editrow .delbtn{ background:none; border:none; color:var(--red); font-size:16px; cursor:pointer; flex-shrink:0; }

  /* ---- Quest cards (simplified view) ---- */
  .progwrap{ position:relative; height:16px; background:var(--line); border-radius:10px; margin:22px 4px 18px; }
  .progfill{ height:100%; background:linear-gradient(90deg,var(--kidcolor),#FFC857); border-radius:10px; transition:width .6s cubic-bezier(.3,1.4,.5,1); }
  .progrunner{ position:absolute; top:-16px; font-size:26px; transform:translateX(-50%); transition:left .6s cubic-bezier(.3,1.4,.5,1); animation:hop 1s ease-in-out infinite; }
  @keyframes hop{ 0%,100%{ margin-top:0; } 50%{ margin-top:-5px; } }
  .qcard{ display:flex; align-items:center; gap:14px; background:var(--panel); border:2.5px solid var(--line); border-radius:22px; padding:14px 16px; margin-bottom:12px; cursor:pointer; box-shadow:0 4px 0 var(--line); transition:transform .1s, box-shadow .1s; user-select:none; -webkit-user-select:none; }
  .qcard:active{ transform:translateY(4px) scale(.98); box-shadow:0 0 0 var(--line); }
  .qcard.focus{ border-color:var(--kidcolor); background:var(--panel2); box-shadow:0 5px 0 var(--kidcolor); }
  .qcard.focus .qicon{ animation:bob 1.4s ease-in-out infinite; }
  .qcard.done{ opacity:.6; background:var(--panel2); box-shadow:none; }
  .qcard.done .qlabel{ text-decoration:line-through; color:var(--muted); }
  .qcard.celebrate{ animation:celebrate .7s ease; }
  .qcard.green.focus{ border-color:var(--green); box-shadow:0 5px 0 var(--green); }
  @keyframes celebrate{ 0%{transform:scale(1);} 25%{transform:scale(1.06) rotate(-1.5deg);} 50%{transform:scale(.97) rotate(1.5deg);} 100%{transform:scale(1);} }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-6deg);} 50%{transform:translateY(-5px) rotate(6deg);} }
  .qicon{ font-size:36px; width:48px; text-align:center; flex-shrink:0; }
  .qmid{ flex:1; min-width:0; }
  .qlabel{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:19px; line-height:1.15; }
  .qtime{ font-size:12px; font-weight:800; color:var(--muted); margin-top:2px; }
  .qtag{ display:inline-block; font-size:10px; font-weight:800; color:#fff; background:var(--kidcolor); border-radius:8px; padding:2px 7px; margin-right:6px; letter-spacing:.3px; }
  .qcheck{ width:46px; height:46px; border-radius:50%; border:3px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; background:var(--panel); }
  .qcard.focus .qcheck{ border-color:var(--kidcolor); }
  .qcard.done .qcheck{ background:var(--kidcolor); border-color:var(--kidcolor); }
  .qcard.green.done .qcheck{ background:var(--green); border-color:var(--green); }
  .qcard.celebrate .qcheck{ animation:pop2 .55s ease; }
  @keyframes pop2{ 0%{transform:scale(.3) rotate(-90deg);} 60%{transform:scale(1.35) rotate(15deg);} 100%{transform:scale(1) rotate(0);} }
  .spark{ position:fixed; pointer-events:none; z-index:2000; font-size:22px; margin:-11px 0 0 -11px; animation:sparkfly .85s ease-out forwards; }
  @keyframes sparkfly{ from{transform:translate(0,0) scale(.6); opacity:1;} to{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot)); opacity:0;} }
  .cheer{ position:fixed; left:50%; top:20%; z-index:2001; pointer-events:none; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:30px; color:var(--kidcolor); text-shadow:0 2px 0 #fff, 0 0 12px #fff; white-space:nowrap; animation:cheer 1.2s ease forwards; }
  @keyframes cheer{ 0%{transform:translate(-50%,20px) scale(.5); opacity:0;} 25%{transform:translate(-50%,0) scale(1.15); opacity:1;} 70%{transform:translate(-50%,-6px) scale(1); opacity:1;} 100%{transform:translate(-50%,-40px) scale(1); opacity:0;} }
  .ipadtop{ display:flex; align-items:center; gap:16px; margin:6px 0 16px; }
  .pctring{ width:120px; height:120px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; position:relative; transition:background .5s; }
  .pctring::after{ content:''; position:absolute; inset:11px; border-radius:50%; background:var(--panel); }
  .pctring .pctnum{ position:relative; z-index:1; text-align:center; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:32px; line-height:1; }
  .pctside{ flex:1; min-width:0; }
  .pctside .pctmsg{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:18px; line-height:1.2; }
  .pctside .pctsub{ color:var(--muted); font-weight:700; font-size:12px; margin-top:4px; }
  .mintiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .mintile{ background:var(--panel2); border:2.5px solid var(--gold); border-radius:20px; padding:12px 6px; text-align:center; }
  .mintile .md{ font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; }
  .mintile .mn{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:30px; line-height:1.1; }
  .mintile .mn small{ font-size:14px; }
  .biglabel{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; margin:4px 0 8px; }
  .bigtiles{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  .bigtile{ position:relative; background:var(--panel); border:2.5px solid var(--line); border-radius:20px; padding:14px 8px 12px; text-align:center; cursor:pointer; box-shadow:0 4px 0 var(--line); user-select:none; -webkit-user-select:none; transition:transform .1s, box-shadow .1s; }
  .bigtile:active{ transform:translateY(4px) scale(.97); box-shadow:0 0 0 var(--line); }
  .bigtile .bi{ font-size:40px; line-height:1.1; }
  .bigtile .bl{ font-weight:800; font-size:12.5px; line-height:1.2; margin-top:4px; }
  .bigtile .bmark{ position:absolute; top:6px; right:8px; font-size:18px; }
  .bigtile.on.bad{ background:rgba(255,92,92,.1); border-color:var(--red); box-shadow:0 4px 0 var(--red); }
  .bigtile.on.good{ background:rgba(47,174,114,.12); border-color:var(--green); box-shadow:0 4px 0 var(--green); }
  .bigtile.shake{ animation:shake .5s ease; }
  .bigtile.bounce{ animation:celebrate .7s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px) rotate(-3deg);} 40%{transform:translateX(7px) rotate(3deg);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
  .alldone{ text-align:center; padding:12px 6px 4px; }
  .alldone .big{ font-size:46px; display:inline-block; animation:wiggle 1.2s ease-in-out infinite; }
  .alldone .tt{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:20px; color:var(--kidcolor); }
  .linkbtn{ width:100%; background:none; border:2px dashed var(--line); color:var(--muted); border-radius:14px; padding:10px; font-weight:800; font-size:13px; cursor:pointer; margin:2px 0 14px; }
  .wrep{ max-height:88vh; overflow-y:auto; text-align:center; }
  .rpctbig{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:56px; line-height:1; } .rpctbig.ok{ color:var(--green); } .rpctbig.low{ color:var(--red); }
  .rsec{ text-align:left; margin-bottom:10px; } .rsh{ font-weight:800; font-size:14px; margin-bottom:4px; }
  .rrow{ display:flex; align-items:center; gap:8px; border-radius:12px; padding:6px 10px; margin-bottom:4px; font-weight:800; font-size:14px; }
  .rrow.g{ background:#E3F8E8; } .rrow.b{ background:#FFE9E4; } .rrow .rl{ flex:1; } .rrow .rn{ font-size:12px; white-space:nowrap; }
  .rgoal{ background:#FFF3C9; border-radius:14px; padding:10px; margin:6px 0 12px; font-weight:800; font-size:14px; }
  .remind-overlay{ position:fixed; inset:0; background:rgba(20,20,35,.55); display:flex; align-items:center; justify-content:center; z-index:3000; padding:20px; }
  .remind-box{ background:var(--panel); border:3px solid var(--kidcolor); border-radius:28px; padding:26px 20px 20px; max-width:340px; width:100%; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.3); animation:rpop .5s cubic-bezier(.3,1.5,.5,1); }
  @keyframes rpop{ from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;} }
  .remind-box .rbig{ font-size:72px; display:inline-block; animation:ring 1s ease-in-out infinite; }
  @keyframes ring{ 0%,100%{transform:rotate(0);} 20%{transform:rotate(-14deg);} 40%{transform:rotate(14deg);} 60%{transform:rotate(-8deg);} 80%{transform:rotate(8deg);} }
  .remind-box .rtitle{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:26px; line-height:1.1; margin:8px 0 2px; color:var(--kidcolor); }
  .remind-box .rsub{ color:var(--muted); font-weight:800; font-size:13px; margin-bottom:16px; }
  .rbtn{ width:100%; border:none; border-radius:16px; padding:14px; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; cursor:pointer; margin-bottom:8px; }
  .rbtn.go{ background:var(--kidcolor); color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.18); }
  .rbtn.snz{ background:var(--panel2); color:var(--ink); font-size:15px; }
  .toggle{ display:flex; align-items:center; justify-content:space-between; background:var(--panel2); border-radius:12px; padding:12px; margin-bottom:8px; font-weight:800; font-size:14px; }
  .wins{ background:var(--panel2); border:2px solid var(--gold); border-radius:16px; padding:10px 12px; margin:0 0 14px; text-align:left; font-weight:800; font-size:14px; line-height:1.55; }
  .wins .winstitle{ font-family:'Baloo 2',sans-serif; font-size:16px; color:var(--kidcolor); }
  .wins .winsmsg{ margin-top:4px; color:var(--muted); font-size:13px; }
  .edittabs{ display:flex; gap:8px; margin-bottom:14px; }
  .edittab{ flex:1; border:2px solid var(--line); background:var(--panel); color:var(--muted); border-radius:14px; padding:9px; font-weight:800; font-size:13px; cursor:pointer; }
  .edittab.active{ background:var(--panel2); color:var(--ink); border-color:var(--gold); }
  .daypicker{ display:flex; gap:5px; margin-bottom:12px; flex-wrap:wrap; }

  return `rgba(${r},${g},${b},${a})`;

function minutesToTime(m){
  m = Math.max(0, Math.min(23*60+59, Math.round(m)));
  let h = Math.floor(m/60), mi = m%60;

  const m = (t||'').match(/(\d+):(\d+)\s*(AM|PM)/i);

  Object.keys(META).forEach(k=>{

    if(!data[k].dayStarAwarded) data[k].dayStarAwarded = {};

async function saveData(scope){

  parts.forEach(part=>{

function sortedEntries(kidKey, day){
  return [...data.schedule[kidKey][day]].sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time));
}
function questsOf(kidKey, day){ return data.schedule[kidKey][day].filter(e=>e.quest); }
function dayTotals(kidKey, day){
  const qs = questsOf(kidKey, day);
  const checks = data[kidKey].checks[day] || {};
  const done = qs.filter(q => checks[q.id]).length;
  return {done, total: qs.length};
}
function weekComplete(kidKey){
  return DAYS.every(d => { const {done,total} = dayTotals(kidKey, d); return total > 0 ? done === total : true; })
    && DAYS.some(d => questsOf(kidKey,d).length > 0);
}
function currentStreak(kidKey){
  let streak = 0;
  for(let i = DAYS.indexOf(actualToday); i >= 0; i--){
    const {done,total} = dayTotals(kidKey, DAYS[i]);
    if(total > 0 && done === total) streak++; else break;

}

function bucketRemaining(kidKey, bucket){
  const allow = data.allowance[kidKey] || {sat:30,sun:30};
  const base = allow[bucket] != null ? allow[bucket] : 30;
  let deduct = 0, add = 0;
  DAYS.forEach(d=>{
    const hits = data[kidKey].penaltyHits[d] || {};
    Object.keys(hits).forEach(pid=>{
      const h = hits[pid];
      if(h && h.bucket === bucket){ const p = data.penalties.find(x=>x.id===pid); if(p) deduct += (p.amount||0); }
    });
  });
  const weeklyHits = data[kidKey].bonusHitsWeekly || {};
  Object.keys(weeklyHits).forEach(bid=>{
    const h = weeklyHits[bid];
    if(h && h.bucket === bucket){ const b = data.bonuses.find(x=>x.id===bid); if(b) add += (b.amount||0); }
  });
  DAYS.forEach(d=>{
    const dailyHits = (data[kidKey].bonusHitsDaily && data[kidKey].bonusHitsDaily[d]) || {};
    Object.keys(dailyHits).forEach(bid=>{
      const h = dailyHits[bid];
      if(h && h.bucket === bucket){ const b = data.bonuses.find(x=>x.id===bid); if(b) add += (b.amount||0); }
    });
  });
  return { base, remaining: Math.max(0, base - deduct + add) };
}

function awardOrRevokeDayStar(kidKey, day){
  const kstate = data[kidKey];
  const {done,total} = dayTotals(kidKey, day);
  const isComplete = total > 0 && done === total;
  const wasAwarded = !!kstate.dayStarAwarded[day];
  if(isComplete && !wasAwarded){
    kstate.dayStarAwarded[day] = true;
    kstate.lifetimeStars = (kstate.lifetimeStars||0) + 1;
    if(kstate.lifetimeStars >= 50) kstate.ever50 = true;
    return true; // newly earned
  }
  if(!isComplete && wasAwarded){
    kstate.dayStarAwarded[day] = false;
    kstate.lifetimeStars = Math.max(0, (kstate.lifetimeStars||0) - 1);
  }
  return false;
}

function toggleTask(kidKey, day, taskId, ev){

const EXERCISE_POINTS = 4;  // each exercise day adds this many % toward the weekly extra-credit cap
const MAX_EXTRA = 20;   // extra credit never adds more than +20% in a week
const WEEKDAYS_FOR_TIME = ['Mon','Tue','Wed','Thu','Fri'];
function weekStats(kidKey){
  let done = 0, total = 0;
  WEEKDAYS_FOR_TIME.forEach(d=>{ const t = dayTotals(kidKey, d); done += t.done; total += t.total; });
  const completion = total ? done/total*100 : 0;
  const k = data[kidKey];
  let pen = 0, bon = 0;
  DAYS.forEach(d=>{
    Object.keys((k.penaltyHits||{})[d]||{}).forEach(pid=>{ const p = data.penalties.find(x=>x.id===pid); if(p) pen += (p.amount||0); });
    Object.keys((k.bonusHitsDaily||{})[d]||{}).forEach(bid=>{ const b = data.bonuses.find(x=>x.id===bid); if(b) bon += (b.amount||0); });
  });
  Object.keys(k.bonusHitsWeekly||{}).forEach(bid=>{ const b = data.bonuses.find(x=>x.id===bid); if(b) bon += (b.amount||0); });
  DAYS.forEach(d=>{ if((k.exerciseDone||{})[d]) bon += EXERCISE_POINTS; });
  // extra credit can only ever add up to MAX_EXTRA points total, and can't be used to cover missed quests/penalties above 100
  const base = Math.max(0, Math.min(100, completion - pen));
  const extra = Math.min(MAX_EXTRA, bon);
  const pct = Math.max(0, Math.min(100 + MAX_EXTRA, Math.round(base + extra)));
  return {pct, completion:Math.round(completion), pen, bon, extra};
}
function weekendMinutes(kidKey, bucket){
  const allow = data.allowance[kidKey] || {sat:30,sun:30};
  const base = allow[bucket] != null ? allow[bucket] : 30;
  const pct = weekStats(kidKey).pct;
  return pct < 100 ? 0 : Math.round(base * pct / 100);   // below 100% = no iPad time; 100% = full; above = proportional
}

function makeChimeUrl(){
  try{
    const sr = 22050, notes = [784,988,1175,1568,1175,1568], step = 0.16;
    const total = Math.floor(sr*(notes.length*step+0.6));
    const buf = new Float32Array(total);
    notes.forEach((f,i)=>{
      const st = Math.floor(i*step*sr), len = Math.floor(step*2*sr);
      for(let n=0;n<len && st+n<total;n++){ const t = n/sr; buf[st+n] += Math.sin(2*Math.PI*f*t)*Math.exp(-t*6)*Math.min(1,n/150); }
    });
    const out = new ArrayBuffer(44+total*2), v = new DataView(out);
    const w = (o,str)=>{ for(let i=0;i<str.length;i++) v.setUint8(o+i, str.charCodeAt(i)); };
    w(0,'RIFF'); v.setUint32(4,36+total*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,total*2,true);
    for(let i=0;i<total;i++) v.setInt16(44+i*2, Math.max(-1,Math.min(1,buf[i]*0.6))*32767, true);
    return URL.createObjectURL(new Blob([out],{type:'audio/wav'}));
  }catch(e){ return null; }
}
function unlockAudio(ev){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state !== 'running') audioCtx.resume();
  }catch(e){}
  if(!(ev && ev.isTrusted)) return;   // only a real tap/click counts as unlocking sound
  if(soundUnlocked) return;
  soundUnlocked = true;
  try{
    if(!chimeEl){ const u = makeChimeUrl(); if(u){ chimeEl = new Audio(u); chimeEl.preload = 'auto'; } }
    if(chimeEl){ chimeEl.muted = true; const pr = chimeEl.play(); if(pr && pr.then) pr.then(()=>{ chimeEl.pause(); chimeEl.currentTime = 0; chimeEl.muted = false; }).catch(()=>{ chimeEl.muted = false; }); }

}

function tone(freqs, step, vol){
  try{
    unlockAudio(); if(!audioCtx) return;
    freqs.forEach((f,i)=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t0 = audioCtx.currentTime + i*step;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+step*1.6);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0+step*1.7);
    });
  }catch(e){}
}

const REM_KEY = 'mw_reminders', FIRED_KEY = 'mw_fired';
let reminders = {on:false, voice:true};
let activeReminder = null;      // {kidKey, id, icon, label}
let snoozeUntil = {};           // key -> minute-of-day
let wakeLock = null;
try{ Object.assign(reminders, JSON.parse(localStorage.getItem(REM_KEY)||'{}')); }catch(e){}
function saveReminders(){ try{ localStorage.setItem(REM_KEY, JSON.stringify(reminders)); }catch(e){} }
function getFired(){
  try{
    const o = JSON.parse(localStorage.getItem(FIRED_KEY)||'{}');
    if(o.date !== new Date().toDateString()) return {date:new Date().toDateString(), keys:{}};
    return o;
  }catch(e){ return {date:new Date().toDateString(), keys:{}}; }
}
function setFired(o){ try{ localStorage.setItem(FIRED_KEY, JSON.stringify(o)); }catch(e){} }
async function requestWake(){
  try{
    if(reminders.on && 'wakeLock' in navigator && document.visibilityState === 'visible'){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible'){ requestWake(); checkReminders(); } });
function speak(text){
  try{
    if(!reminders.voice || !window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.95; u.pitch = 1.1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

const REMIND_OFFSETS = [15, 3];   // minutes before a quest starts
const BED_REMINDER = {h:20, m:50};  // daily bedtime reminder, independent of quests
function checkReminders(){
  if(!reminders.on || editMode || activeReminder || !data) return;
  const now = new Date(), nowMin = now.getHours()*60+now.getMinutes();
  const fired = getFired();
  const list = (data.schedule[currentKid] && data.schedule[currentKid][actualToday]) || [];
  const checks = (data[currentKid].checks[actualToday]) || {};
  // daily bedtime reminder (not tied to any quest); can fire from 8:50 PM until 9:30 PM
  const bedStart = BED_REMINDER.h*60+BED_REMINDER.m, bedKey = currentKid+'|bedtime';
  if(!fired.keys[bedKey] && nowMin >= bedStart && nowMin < bedStart+40){
    fired.keys[bedKey] = 1; setFired(fired);
    const nm = META[currentKid].name, sayBed = nm+', time to get ready for bed! You finished '+dayTotals(currentKid, actualToday).done+' of '+dayTotals(currentKid, actualToday).total+' quests today. Brush your teeth and put on your pajamas.';
    activeReminder = {kidKey:currentKid, id:'bedtime', kind:'bed', icon:'🛏️', label:'Get ready for bed', off:0, time:'', say:sayBed};
    playChime(); speak(sayBed); startRemindLoop(sayBed);
    render();
    return;
  }
  const sorted = [...list].filter(e=>e.quest && !checks[e.id]).sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time));
  for(const e of sorted){
    const start = timeToMinutes(e.time);
    for(let i=0;i<REMIND_OFFSETS.length;i++){
      const off = REMIND_OFFSETS[i];
      const key = currentKid+'|'+e.id+'|'+off;
      const winStart = start - off;
      const winEnd = (i+1 < REMIND_OFFSETS.length) ? start - REMIND_OFFSETS[i+1] : start;  // don't replay an old stage once the next one is due
      if(fired.keys[key] || nowMin < winStart || nowMin >= winEnd) continue;
      fired.keys[key] = 1; setFired(fired);
      activeReminder = {kidKey:currentKid, id:e.id, icon:e.icon, label:e.label, off, time:e.time, say:''};
      playChime();
      const nm = META[currentKid].name;
      const sayText = off>=10 ? nm+', '+e.label+' starts in '+off+' minutes.' : nm+', almost time! '+e.label+' starts in '+off+' minutes. Get ready!';
      activeReminder.say = sayText; speak(sayText); startRemindLoop(sayText);
      render();
      return;
    }
  }
}
let remindLoop = null;
function startRemindLoop(text){
  stopRemindLoop();
  remindLoop = setInterval(()=>{
    if(!activeReminder){ stopRemindLoop(); return; }
    playChime(); setTimeout(()=>speak(text), 1100);
  }, 10000);
}
function stopRemindLoop(){
  if(remindLoop){ clearInterval(remindLoop); remindLoop = null; }
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
}
function dismissReminder(){ stopRemindLoop(); activeReminder = null; render(); }

/* ---------------- Calendar export (.ics) ---------------- */
function icsEsc(t){ return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function exportICS(kidKey){
  const pad = n=>String(n).padStart(2,'0');
  const fmtD = d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const fmtT = m=>pad(Math.floor(m/60))+pad(m%60)+'00';
  const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const dow = {Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:0};
  const byday = {Mon:'MO',Tue:'TU',Wed:'WE',Thu:'TH',Fri:'FR',Sat:'SA',Sun:'SU'};
  const name = META[kidKey].name;
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mission Week//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:'+name+' Mission Week'];
  let count = 0;
  DAYS.forEach(day=>{
    const d = new Date(); d.setHours(0,0,0,0);
    while(d.getDay() !== dow[day]) d.setDate(d.getDate()+1);
    data.schedule[kidKey][day].filter(e=>e.quest).forEach(e=>{
      const s = timeToMinutes(e.time);
      let en = e.end ? timeToMinutes(e.end) : s+30; if(en <= s) en = s+30;
      const ds = fmtD(d);
      L.push('BEGIN:VEVENT','UID:mw-'+kidKey+'-'+day+'-'+e.id+'@missionweek','DTSTAMP:'+stamp,
        'DTSTART:'+ds+'T'+fmtT(s),'DTEND:'+ds+'T'+fmtT(en),'RRULE:FREQ=WEEKLY;BYDAY='+byday[day],
        'SUMMARY:'+icsEsc(e.icon+' '+e.label),
        'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(name+': '+e.label+' starts in 15 minutes'),'TRIGGER:-PT15M','END:VALARM',
        'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(name+': '+e.label+' starts in 3 minutes!'),'TRIGGER:-PT3M','END:VALARM',
        'END:VEVENT');
      count++;
    });
  });
  // daily bedtime reminder (not tied to any quest)
  {
    const d0 = new Date(); d0.setHours(0,0,0,0);
    const bs = BED_REMINDER.h*60+BED_REMINDER.m;
    L.push('BEGIN:VEVENT','UID:mw-'+kidKey+'-bedtime@missionweek','DTSTAMP:'+stamp,
      'DTSTART:'+fmtD(d0)+'T'+fmtT(bs),'DTEND:'+fmtD(d0)+'T'+fmtT(bs+10),'RRULE:FREQ=DAILY',
      'SUMMARY:'+icsEsc('🌙 Get ready for bed'),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(name+': time to get ready for bed! Brush teeth, pajamas, into bed.'),'TRIGGER:PT0S','END:VALARM',
      'END:VEVENT');
    count++;
  }
  L.push('END:VCALENDAR');
  const blob = new Blob([L.join('\r\n')], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'mission-week-'+kidKey+'.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 10000);
  return count;
}

function moveScheduleItem(id, beforeId){
  // beforeId: id of the item that should come right after the moved one (null = last)
  const list = data.schedule[editKid][editDay];
  const item = list.find(e=>e.id===id); if(!item) return;
  const others = sortedEntries(editKid, editDay).filter(e=>e.id!==id);
  const idx = beforeId ? others.findIndex(e=>e.id===beforeId) : others.length;
  const prev = idx>0 ? others[idx-1] : null;
  const next = idx<others.length ? others[idx] : null;
  const s0 = timeToMinutes(item.time);
  const dur = item.end ? Math.max(5, timeToMinutes(item.end)-s0) : 0;
  const prevStart = prev ? timeToMinutes(prev.time) : null;
  const prevEnd = prev ? (prev.end ? timeToMinutes(prev.end) : prevStart) : null;
  const nextStart = next ? timeToMinutes(next.time) : null;
  let ns;
  if(!prev && next){ ns = nextStart - (dur||15); if(ns<0) ns = Math.max(0, nextStart-1); }
  else if(prev && !next){ ns = prevEnd > prevStart ? prevEnd : prevStart + 15; }
  else if(prev && next){
    if(prevEnd > prevStart && prevEnd < nextStart) ns = prevEnd;
    else ns = Math.floor((prevStart + nextStart)/2/5)*5;
    if(ns<=prevStart) ns = prevStart + 1;
  } else return;
  item.time = minutesToTime(ns);
  if(item.end) item.end = minutesToTime(ns + dur);
  saveData('schedule'); renderEdit();
}
function attachDragHandles(){
  document.querySelectorAll('.draghandle').forEach(h=>{
    h.addEventListener('pointerdown', ev=>{
      ev.preventDefault();
      const row = h.closest('.editrow');
      const rows = [...document.querySelectorAll('.editrow[data-rowid]')];
      const startY = ev.clientY;
      const rects = rows.map(r=>r.getBoundingClientRect());
      const myIdx = rows.indexOf(row);
      const myH = rects[myIdx].height + 6;
      row.classList.add('dragging');
      rows.forEach(r=>{ if(r!==row) r.classList.add('shifting'); });
      try{ h.setPointerCapture(ev.pointerId); }catch(e){}
      let target = myIdx;
      const move = e=>{
        const dy = e.clientY - startY;
        row.style.transform = `translateY(${dy}px)`;
        const center = rects[myIdx].top + rects[myIdx].height/2 + dy;
        let t = 0;
        rects.forEach((r,i)=>{ if(i!==myIdx && center > r.top + r.height/2) t++; });
        // t counts rows above the dragged center, adjust for own slot
        target = t;
        rows.forEach((r,i)=>{
          if(r===row) return;
          const pos = i - (i>myIdx?1:0); // index among others
          let sh = 0;
          if(pos >= target && i < myIdx) sh = myH;
          else if(pos < target && i > myIdx) sh = -myH;
          r.style.transform = sh ? `translateY(${sh}px)` : '';
        });
        // auto-scroll near edges
        if(e.clientY < 80) window.scrollBy(0,-12);
        else if(e.clientY > window.innerHeight-80) window.scrollBy(0,12);
      };
      const up = ()=>{
        h.removeEventListener('pointermove', move);
        h.removeEventListener('pointerup', up);
        h.removeEventListener('pointercancel', cancel);
        const others = rows.filter(r=>r!==row);
        const beforeEl = others[target] || null;
        const id = row.dataset.rowid;
        if(target === myIdx){ renderEdit(); return; }
        moveScheduleItem(id, beforeEl ? beforeEl.dataset.rowid : null);
      };
      const cancel = ()=>{
        h.removeEventListener('pointermove', move);
        h.removeEventListener('pointerup', up);
        h.removeEventListener('pointercancel', cancel);
        renderEdit();
      };
      h.addEventListener('pointermove', move);
      h.addEventListener('pointerup', up);
      h.addEventListener('pointercancel', cancel);
    });
  });
}
function attachEditListeners(){

}

  const exOn = !!kstate.exerciseDone[currentDay];
  const exTile = `<div class="bigtile good ${exOn?'on':''} ${justDone==='exercise'?'bounce':''}" onclick="toggleExercise('${currentKid}','${currentDay}',event)">
      ${exOn?'<div class="bmark">🌟</div>':''}<div class="bi">🏃</div><div class="bl">Exercise<br>about 60 min</div></div>`;
  const minTiles = (isWeekend && ws.pct < 100) ? `<div class="panel" style="text-align:center;background:var(--panel2);margin-bottom:14px;"><div style="font-size:34px;">🔒</div><div style="font-weight:800;">No iPad time this weekend</div><div class="pctsub">You need 100% to unlock it. Check the report to see how to do better next week!</div></div>` : isWeekend ? `<div class="mintiles">
      <div class="mintile"><div class="md">Saturday</div><div class="mn">${weekendMinutes(currentKid,'sat')}<small> min</small></div></div>
      <div class="mintile"><div class="md">Sunday</div><div class="mn">${weekendMinutes(currentKid,'sun')}<small> min</small></div></div></div>` : '';
  const ipadHtml = `<div class="panel">
      <h2 style="font-size:18px;">📱 Weekend iPad Time</h2>
      <div class="ipadtop">
        <div class="pctring" style="background:conic-gradient(${ringColor} ${ringFill*3.6}deg, var(--line) 0deg)"><div class="pctnum">${ws.pct}%</div></div>
        <div class="pctside"><div class="pctmsg">${msg}</div>
          <div class="pctsub">${isWeekend ? (ws.pct>=100 ? '🎁 = <b>'+weekendMinutes(currentKid,'sat')+' min</b> Saturday + <b>'+weekendMinutes(currentKid,'sun')+' min</b> Sunday' : '🔒 = <b>0 min</b> this weekend') : 'Do all your quests Mon–Fri to reach 100%. Under 100% = no iPad time 🔒'}</div></div>
      </div>
      ${minTiles}
      <button class="rbtn go" style="width:100%;margin-bottom:12px;" onclick="openReport()">📊 See my weekly report</button>
      <div class="biglabel">⚠️ Oops… <span style="color:var(--muted);font-weight:700;font-size:12px;">(a grown-up taps these)</span></div>
      <div class="bigtiles">${penTiles}</div>
      <div class="biglabel">🎯 Extra credit!</div>
      <div class="bigtiles">${exTile}${bonTiles}</div>
    </div>`;

  const exDone = !!kstate.exerciseDone[currentDay];

  let reportHtml = '';
  if(isWeekend && !activeReminder && reportKid !== currentKid){
    try{ const rk = 'mw_report|'+kstate.weekStart+'|'+actualToday+'|'+currentKid; if(!localStorage.getItem(rk)){ localStorage.setItem(rk,'1'); reportKid = currentKid; } }catch(e){}
  }
  if(reportKid === currentKid) reportHtml = weekReportHtml(currentKid);
  let modalHtml = '';
  if(pendingChoice && pendingChoice.kidKey === currentKid){
    const isBonus = pendingChoice.kind === 'bonus';
    const item = isBonus ? data.bonuses.find(x=>x.id===pendingChoice.id) : data.penalties.find(x=>x.id===pendingChoice.id);
    if(item){
      modalHtml = `<div class="modal-overlay">
        <div class="modal-box">
          <div class="modaltitle">${item.icon} ${item.label}</div>
          <div class="modalsub">${isBonus?'Add':'Take'} ${item.amount} minutes ${isBonus?'to':'from'} which day's screen time?</div>
          <div class="modalbtns">
            <button class="modalbtn" style="${isBonus?'background:var(--green);':''}" onclick="confirmChoice('sat')">Saturday</button>
            <button class="modalbtn" style="${isBonus?'background:var(--green);':''}" onclick="confirmChoice('sun')">Sunday</button>
          </div>
          <button class="modalcancel" onclick="cancelChoice()">Cancel</button>
        </div>
      </div>`;
    }
  }

  let remindHtml = '';
  if(activeReminder && activeReminder.kidKey === currentKid){
    if(activeReminder.kind === 'bed'){
      remindHtml = `<div class="remind-overlay"><div class="remind-box">
      <div class="rbig">🌙</div>
      <div class="rtitle">Bedtime soon!</div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;margin-bottom:2px;">Time to get ready for bed</div>
      <div class="rsub">🪥 Brush teeth · 👕 Pajamas · 🛏️ Into bed</div>
      ${todayWinsHtml(activeReminder.kidKey)}
      <button class="rbtn go" onclick="dismissReminder()">OK, going! 😴</button>
    </div></div>`;
    } else {
      const soon = activeReminder.off < 10;
      remindHtml = `<div class="remind-overlay"><div class="remind-box">
      <div class="rbig">${activeReminder.icon}</div>
      <div class="rtitle">${soon?'Almost time!':'Heads up!'}</div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;margin-bottom:2px;">${activeReminder.label}</div>
      <div class="rsub">starts in ${activeReminder.off} minutes · ${activeReminder.time}</div>
      <button class="rbtn go" onclick="dismissReminder()">${soon?"I'm ready! 💪":'Got it! 👍'}</button>
    </div></div>`;
    }
  }
  const nowStr = new Date().toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'}) + ' · ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});

  root.innerHTML = `
    <div class="datebar" style="text-align:center;color:var(--muted);font-weight:800;font-size:12px;margin-bottom:10px;">${nowStr}${reminders.on?' · 🔔 reminders on':''}</div>
    <div class="topbar">
      <div class="kidbar">
        ${Object.keys(META).map(k=>`
          <button class="kidtab ${k===currentKid?'active':''}" style="${k===currentKid?'--kidcolor:'+META[k].color:''}" onclick="selectKid('${k}')">${META[k].name}</button>`).join('')}
      </div>
      <button class="gearbtn" onclick="toggleReminders()" title="Reminders">${reminders.on?'🔔':'🔕'}</button>
      <button class="gearbtn" onclick="openHistory()" title="History">📜</button>
      <button class="gearbtn" onclick="openEdit('schedule')" title="Edit">⚙️</button>
    </div>

    <div class="levelcard">
      <div class="levelbadge" style="--xp:${pct}"><span>Lv${level}</span></div>
      <div class="levelinfo">
        <div class="lvltitle">${kid.name} · ${xp}/${XP_PER_LEVEL} XP to next level</div>
        <div class="xpbar"><div style="width:${pct}%"></div></div>
      </div>
      <div class="streak">🔥 ${streak}</div>
    </div>

    <div class="panel" style="padding-top:14px;padding-bottom:14px;">
      <div class="panelhead">
        <h2 style="font-size:15px;">⭐ 50-Star Taobao Reward</h2>
        ${(kstate.lifetimeStars||0) >= 50 ? `<button class="rewardbtn" style="padding:8px 14px;" onclick="claimStarReward('${currentKid}')">🛍️ Redeem now</button>` : ''}
      </div>
      <div class="panelsub">${kstate.lifetimeStars||0}/50 stars saved${kstate.taobaoRedemptions ? ' · 🛍️ '+kstate.taobaoRedemptions+' redeemed so far' : ''}</div>
      <div class="xpbar"><div style="width:${Math.min(100,Math.round(((kstate.lifetimeStars||0)/50)*100))}%;background:var(--gold);"></div></div>
    </div>

    <div class="daytabs">${stripHtml}</div>

    ${rewardHtml}

    <div class="panel">
      <h2>${currentDay}'s Quests · ${dt.done}/${dt.total}</h2>
      <div class="panelsub">Finish ALL of them to earn 1 ⭐</div>
      ${progressHtml}
      ${cardsHtml || '<div class="panelsub">No quests today — enjoy! 🎈</div>'}
      ${alldoneHtml}
      <button class="linkbtn" onclick="showFull=!showFull;render()">${showFull?'▲ Hide':'📅 Show'} full day schedule</button>
      ${showFull ? `<div class="timeline">${timelineHtml}</div>` : ''}
    </div>

    ${ipadHtml}

    <button class="linkbtn" onclick="showMore=!showMore;render()">${showMore?'▲ Hide':'🏅 Show'} badges</button>
    ${showMore ? `
    <div class="panel">
      <h2 style="font-size:16px;">🏅 Badges</h2>
      <div class="badgerow">${badges.map(b=>`<div class="badge ${b.unlocked?'unlocked':''}">${b.icon} ${b.label}</div>`).join('')}</div>
    </div>

    ` : ''}

    ${modalHtml}${reportHtml}${remindHtml}
  `;
}

/* ---------------- Render: history view ---------------- */
function openHistory(){ editMode = 'history'; editKid = currentKid; renderHistory(); }
function closeHistory(){ editMode = null; render(); }
function renderHistory(){
  applyTheme(META[editKid].color);
  const root = document.getElementById('app');
  const log = (data[editKid].weekLog || []).slice().reverse();
  let body = '';
  if(log.length === 0){
    body = `<div class="panel"><div class="panelsub" style="text-align:center;padding:10px 0;">No past weeks yet — this fills in once a week resets (every Monday).</div></div>`;
  } else {
    body = log.map(entry=>{
      const days = DAYS.map(d=>{
        const s = entry.days[d];
        if(!s) return '';
        const penTxt = s.penalties.length ? `<div style="color:var(--red);font-size:11px;">${s.penalties.join(', ')}</div>` : '';
        return `<div class="penrow" style="background:transparent;padding:6px 4px;">
          <div class="tlabel" style="flex:0 0 40px;font-weight:800;">${d}</div>
          <div class="tlabel">${s.done}/${s.total} quests ${s.star?'⭐':''} ${s.exercise?'🏃':''}${penTxt}</div>
        </div>`;
      }).join('');
      const bonusTxt = entry.bonuses && entry.bonuses.length ? `<div class="panelsub" style="color:var(--green);">${entry.bonuses.join(', ')}</div>` : '';
      return `<div class="panel">
        <h2 style="font-size:15px;">Week of ${entry.weekStart}</h2>
        <div class="panelsub">${entry.rewardClaimed ? '🎉 Weekly reward claimed' : 'Reward not claimed'}</div>
        ${bonusTxt}
        ${days}
      </div>`;
    }).join('');
  }
  root.innerHTML = `
    <button class="backbtn" onclick="closeHistory()">← Back</button>
    <div class="kidbar" style="margin-bottom:14px;">
      ${Object.keys(META).map(k=>`<button class="kidtab ${k===editKid?'active':''}" style="${k===editKid?'--kidcolor:'+META[k].color:''}" onclick="editKid='${k}';renderHistory()">${META[k].name}</button>`).join('')}
    </div>
    ${body}
  `;
}

/* ---------------- Render: edit view ---------------- */
function renderEdit(){
  applyTheme(META[editKid].color);
  const root = document.getElementById('app');
  let body = '';
  if(editMode === 'schedule'){
    const entries = sortedEntries(editKid, editDay);
    body = `
      <div class="kidbar" style="margin-bottom:10px;">
        ${Object.keys(META).map(k=>`<button class="kidtab ${k===editKid?'active':''}" style="${k===editKid?'--kidcolor:'+META[k].color:''}" onclick="editKid='${k}';renderEdit()">${META[k].name}</button>`).join('')}
      </div>
      <div class="daypicker">${DAYS.map(d=>`<button class="daypickbtn ${d===editDay?'active':''}" onclick="editDay='${d}';renderEdit()">${d}</button>`).join('')}</div>
      <div class="panel">
        <div class="panelsub">☰ drag to move · Start · End · Icon · Label · Quest?</div>
        ${entries.map(e=>`
          <div class="editrow" data-rowid="${e.id}">
            <div class="draghandle" data-id="${e.id}" title="Drag to move">☰</div>
            <input class="ein-time sched-field" type="text" data-id="${e.id}" data-field="time" value="${e.time.replace(/"/g,'&quot;')}">
            <input class="ein-time sched-field" type="text" data-id="${e.id}" data-field="end" value="${(e.end||'').replace(/"/g,'&quot;')}" placeholder="end">
            <input class="ein-icon sched-field" type="text" data-id="${e.id}" data-field="icon" value="${e.icon.replace(/"/g,'&quot;')}">
            <input class="ein-label sched-field" type="text" data-id="${e.id}" data-field="label" value="${e.label.replace(/"/g,'&quot;')}">
            <input type="checkbox" class="sched-field" data-id="${e.id}" data-field="quest" ${e.quest?'checked':''} title="Countable quest?">
            <button class="delbtn" onclick="deleteScheduleItem('${e.id}')">✕</button>
          </div>`).join('')}
        <button class="addbtn" onclick="addScheduleItem()">+ Add item to ${editDay}</button>
        <div>
          <button class="smallbtn" onclick="resetDayToDefault()">↺ Reset ${editDay} to default</button>
          <button class="smallbtn" onclick="resetKidScheduleToDefault()">↺ Reset ALL 7 days to default</button>
        </div>
      </div>`;
  } else if(editMode === 'reminders'){
    body = `
      <div class="panel">
        <h2 style="font-size:16px;margin-bottom:6px;">🔔 Reminders on this iPad</h2>
        <div class="panelsub">15 minutes and again 3 minutes before each quest starts, the app pops up a big alert with a chime (and says it out loud). Works while the app is open on screen — it keeps the screen awake when reminders are on. Each iPad reminds for the kid tab it's showing.</div>
        <div class="toggle"><span>Reminders</span><button class="smallbtn" style="margin:0" onclick="toggleReminders()">${reminders.on?'🔔 ON — tap to turn off':'🔕 OFF — tap to turn on'}</button></div>
        <div class="toggle"><span>Speak out loud</span><button class="smallbtn" style="margin:0" onclick="toggleReminderVoice()">${reminders.voice?'🔊 ON':'🔇 OFF'}</button></div>
        <button class="smallbtn" style="margin-left:0" onclick="unlockAudio();playChime();speak('Test reminder. Writing starts in 15 minutes.')">▶︎ Test sound</button>
      </div>
      <div class="panel">
        <h2 style="font-size:16px;margin-bottom:6px;">📆 Alarms even when the screen is off</h2>
        <div class="panelsub">Download a calendar file with every quest (weekly, alerts 15 min and 3 min before; plus a daily 8:50 PM bedtime reminder). Open it on the iPad and tap Add All — put it in a new calendar like "Leyna Mission" so you can delete it all at once if the schedule changes. Re-export after editing the schedule.</div>
        ${Object.keys(META).map(k=>`<button class="smallbtn" style="margin-left:0" onclick="exportICS('${k}')">⬇️ ${META[k].name}'s calendar (.ics)</button>`).join('')}
      </div>`;
  } else {
    body = `
      <div class="panel">
        <h2 style="font-size:16px;margin-bottom:10px;">⚠️ Penalty items</h2>
        <div class="panelsub">Icon · Label · Points (%) taken off the weekend iPad score</div>
        ${data.penalties.map(p=>`
          <div class="editrow">
            <input class="ein-icon pen-field" type="text" data-id="${p.id}" data-field="icon" value="${p.icon.replace(/"/g,'&quot;')}">
            <input class="ein-label pen-field" type="text" data-id="${p.id}" data-field="label" value="${p.label.replace(/"/g,'&quot;')}">
            <input type="text" class="pen-field" data-id="${p.id}" data-field="amount" value="${p.amount}" style="width:44px;text-align:center;">
            <button class="delbtn" onclick="deletePenalty('${p.id}')">✕</button>
          </div>`).join('')}
        <button class="addbtn" onclick="addPenalty()">+ Add penalty</button>
      </div>
      <div class="panel">
        <h2 style="font-size:16px;margin-bottom:10px;">🎯 Bonuses (screen-time add-ons)</h2>
        <div class="panelsub">Icon · Label · Points (%) added (extras total max +20% per week) · Daily (resets every day) or Weekly (once per week)</div>
        ${data.bonuses.map(b=>`
          <div class="editrow">
            <input class="ein-icon bonus-field" type="text" data-id="${b.id}" data-field="icon" value="${b.icon.replace(/"/g,'&quot;')}">
            <input class="ein-label bonus-field" type="text" data-id="${b.id}" data-field="label" value="${b.label.replace(/"/g,'&quot;')}">
            <input type="text" class="bonus-field" data-id="${b.id}" data-field="amount" value="${b.amount}" style="width:44px;text-align:center;">
            <select class="bonus-freq" data-id="${b.id}" style="background:var(--panel);border:1.5px solid var(--line);color:var(--ink);border-radius:8px;padding:6px;font-weight:700;font-size:12px;">
              <option value="daily" ${b.frequency==='daily'?'selected':''}>Daily</option>
              <option value="weekly" ${b.frequency==='weekly'?'selected':''}>Weekly</option>
            </select>
            <button class="delbtn" onclick="deleteBonus('${b.id}')">✕</button>
          </div>`).join('')}
        <button class="addbtn" onclick="addBonus()">+ Add bonus</button>
      </div>
      <div class="panel">
        <h2 style="font-size:16px;margin-bottom:10px;">📱 Weekend iPad/TV allowance</h2>
        ${Object.keys(META).map(k=>`
          <div class="allowrow"><div>${META[k].name}</div><div>
            <input type="number" class="allow-field" data-kid="${k}" data-bucket="sat" value="${data.allowance[k].sat}"> Sat &nbsp;
            <input type="number" class="allow-field" data-kid="${k}" data-bucket="sun" value="${data.allowance[k].sun}"> Sun
          </div></div>`).join('')}
      </div>`;
  }

  root.innerHTML = `
    <button class="backbtn" onclick="closeEdit()">← Back</button>
    <div class="edittabs">
      <button class="edittab ${editMode==='schedule'?'active':''}" onclick="editMode='schedule';renderEdit()">🗓 Schedule</button>
      <button class="edittab ${editMode==='penalties'?'active':''}" onclick="editMode='penalties';renderEdit()">⚠️ Penalties & Time</button>
      <button class="edittab ${editMode==='reminders'?'active':''}" onclick="editMode='reminders';renderEdit()">🔔 Reminders</button>
    </div>
    ${body}
  `;
  attachEditListeners();
}

function selectKid(k){ currentKid = k; chestOpen = false; render(); }
function selectDay(d){ currentDay = d; render(); }
function openChest(){ chestOpen = true; render(); }
window.toggleTask = toggleTask;
window.claimStarReward = claimStarReward;
window.toggleExercise = toggleExercise;
window.confirmChoice = confirmChoice;
window.cancelChoice = cancelChoice;
window.togglePenalty = togglePenalty;
window.toggleBonus = toggleBonus;
window.claimReward = claimReward;
window.selectKid = selectKid;
window.selectDay = selectDay;
window.openChest = openChest;
window.toggleReminders = toggleReminders; window.toggleReminderVoice = toggleReminderVoice;
window.dismissReminder = dismissReminder; window.hearIt = hearIt;
window.exportICS = exportICS; window.unlockAudio = unlockAudio; window.playChime = playChime; window.speak = speak;
window.openEdit = openEdit;
window.closeEdit = closeEdit;
window.openHistory = openHistory;
window.closeHistory = closeHistory;
window.renderHistory = renderHistory;
window.editKid = editKid; window.editDay = editDay; window.editMode = editMode;
window.renderEdit = renderEdit;
window.addScheduleItem = addScheduleItem;
window.deleteScheduleItem = deleteScheduleItem;
window.resetDayToDefault = resetDayToDefault;
window.resetKidScheduleToDefault = resetKidScheduleToDefault;
window.addPenalty = addPenalty;
window.deletePenalty = deletePenalty;
window.addBonus = addBonus;
window.deleteBonus = deleteBonus;
window.onAllowanceChange = onAllowanceChange;

(async function init(){
  document.getElementById('app').innerHTML = '<div style="text-align:center;color:var(--muted);padding:30px 0;">Loading…</div>';
  await loadData();
  render();
  setInterval(async ()=>{
    const nowDateStr = new Date().toDateString();
    if(nowDateStr !== lastKnownDate){
      lastKnownDate = nowDateStr;
      const wasOnToday = (currentDay === actualToday);
      actualToday = todayKey();
      if(wasOnToday) currentDay = actualToday;
      await loadData(); // re-checks the Monday weekly rollover too, in case the app was left open across it
    }
    // only refresh the live "NOW" indicator on the main view; don't interrupt editing or an open modal
    if(!editMode && !pendingChoice && !activeReminder) render();
  }, 60000);
  setInterval(checkReminders, 15000);
  ['click','touchend','pointerdown'].forEach(ev=>document.addEventListener(ev, unlockAudio, {passive:true}));
  requestWake(); checkReminders();
})();
</script>
</body>
</html>
